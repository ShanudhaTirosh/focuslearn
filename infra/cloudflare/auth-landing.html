<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusLearn - Authentication & Password Reset</title>
  <style>
    :root {
      --primary: #2563EB;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #111827;
      --muted: #64748B;
      --border: #E2E8F0;
      --success: #16A34A;
      --error: #DC2626;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--primary);
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .status-msg {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
    }
    .status-msg.success { color: var(--success); }
    .status-msg.error { color: var(--error); }
  </style>
</head>
<body>
  <div class="card">
    <h1>FocusLearn</h1>
    <div id="loading-view">
      <p>Verifying your authentication credentials...</p>
    </div>

    <div id="confirmed-view" style="display: none;">
      <p style="color: var(--success); font-weight: 600;">✓ Email Confirmed Successfully!</p>
      <p>You can now open the FocusLearn app and sign in with your email and password.</p>
      <a id="open-app-btn" href="focuslearn://auth" class="btn">Open FocusLearn App</a>
    </div>

    <div id="reset-password-view" style="display: none;">
      <p>Enter your new password below to reset your account password.</p>
      <form id="reset-form" onsubmit="handleResetPassword(event)">
        <input id="new-password" type="password" class="input" placeholder="New Password (min 10 characters)" required minlength="10" />
        <button type="submit" class="btn">Update Password</button>
      </form>
      <div id="reset-status" class="status-msg"></div>
    </div>
  </div>

  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash || window.location.search);
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const type = params.get('type');

    const loadingView = document.getElementById('loading-view');
    const confirmedView = document.getElementById('confirmed-view');
    const resetView = document.getElementById('reset-password-view');
    const openAppBtn = document.getElementById('open-app-btn');

    if (accessToken) {
      // Build deep link
      const deepLinkUrl = `focuslearn://auth?access_token=${accessToken}&refresh_token=${refreshToken || ''}&type=${type || ''}`;
      openAppBtn.href = deepLinkUrl;

      // Try automatic redirect to mobile app
      window.location.href = deepLinkUrl;

      loadingView.style.display = 'none';
      if (type === 'recovery') {
        resetView.style.display = 'block';
      } else {
        confirmedView.style.display = 'block';
      }
    } else {
      loadingView.style.display = 'none';
      confirmedView.style.display = 'block';
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const statusEl = document.getElementById('reset-status');
      const newPassword = document.getElementById('new-password').value;

      if (!accessToken) {
        statusEl.className = 'status-msg error';
        statusEl.innerText = 'Missing recovery token. Please request a new password reset link.';
        return;
      }

      try {
        const apiUrl = window.location.origin.includes('localhost') ? 'http://localhost:8000' : 'https://eduapp-api.shanutechx.com';
        const response = await fetch(`${apiUrl}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`,
            'apikey': 'ANON_KEY'
          },
          body: JSON.stringify({ password: newPassword })
        });

        if (response.ok) {
          statusEl.className = 'status-msg success';
          statusEl.innerText = 'Password updated successfully! Open the app to sign in.';
        } else {
          const err = await response.json();
          statusEl.className = 'status-msg error';
          statusEl.innerText = err.msg || 'Failed to update password.';
        }
      } catch (err) {
        statusEl.className = 'status-msg error';
        statusEl.innerText = 'Network error contacting auth server.';
      }
    }
  </script>
</body>
</html>
