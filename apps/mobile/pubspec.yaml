name: focuslearn
description: FocusLearn study and focus companion for Sri Lankan A/L students.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"      # verify against the Flutter stable you install
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any                    # flutter_localizations pins the exact version
  flutter_riverpod: ^2.5.1     # all versions below: verify with `flutter pub outdated`
  go_router: ^14.0.0
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  focuslearn_core:
    path: ../../packages/core
  focuslearn_design_system:
    path: ../../packages/design_system
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
